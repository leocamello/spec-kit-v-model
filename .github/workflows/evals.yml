name: Evaluations

on:
  workflow_dispatch:
    inputs:
      run_llm_evals:
        description: "Run LLM-as-judge evaluations (requires OPENAI_API_KEY)"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1"  # Weekly on Monday at 6:00 UTC

permissions:
  contents: read

jobs:
  structural-evals:
    name: Structural Evaluations (Deterministic)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run structural eval tests
        run: |
          pytest tests/evals/ -m structural -v --tb=short

  llm-evals:
    name: LLM-as-Judge Evaluations
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_llm_evals == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run LLM eval tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pytest tests/evals/ -m eval -v --tb=long
